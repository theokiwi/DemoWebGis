services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: webgis
      POSTGRES_USER: webgis
      POSTGRES_PASSWORD: local-development-only
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data", "../packages/db/migrations:/docker-entrypoint-initdb.d:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U webgis"], interval: 5s, timeout: 3s, retries: 20 }
  otp:
    image: opentripplanner/opentripplanner:2.7.0
    command: ["--load", "/var/opentripplanner"]
    ports: ["8080:8080"]
    volumes: ["./otp:/var/opentripplanner:ro"]
volumes: { postgres-data: {} }
